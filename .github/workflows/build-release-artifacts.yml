# push main  -> detekt + unit tests only
# PR / manual run / v* tags -> full APK + IPA (+ release on tags)
# docs (md, LICENSE, docs/) are ignored on push and PR
# note: reusable workflow keeps caller's event_name (tag push stays "push")

name: Build APK and IPA

on:
  push:
    branches: [main, master, healthlab]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "LICENSE.*"
      - "docs/**"
  pull_request:
    branches: [main, master, healthlab]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE"
      - "LICENSE.*"
      - "docs/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: >-
    build-artifacts-${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  XCODE_VERSION: "26.2"
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.daemon.jvm.options=-Xmx2g
  KONAN_DATA_DIR: ${{ github.workspace }}/.konan-cache

jobs:
  # Warms the shared Gradle + Konan caches from trusted main pushes so
  # read-only PR jobs restore instead of rebuilding the K/N toolchain.
  ios-cache-warmup:
    name: iOS cache warmup
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx6g
        -Dkotlin.daemon.jvm.options=-Xmx6g
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (max cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          gradle-home-cache-excludes: |
            caches/*/kotlin-dsl/
            caches/*/scripts/

      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.KONAN_DATA_DIR }}
            ~/.konan
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-v4
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-konan-v4-
            ${{ runner.os }}-konan-v3-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Compile-only: downloads the Konan toolchain and warms K/N task
      # outputs without running the full Release link + xcodebuild.
      - name: Warm iOS compile + test compile
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileTestKotlinIosSimulatorArm64 --stacktrace --build-cache --configuration-cache

  quick-check:
    name: Quick check
    # Branch pushes only — not version tags (those need full APK/IPA).
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Detekt
        run: ./gradlew detekt --stacktrace --build-cache --configuration-cache

      - name: Unit tests (miclient JVM)
        run: ./gradlew :miclient:androidTest --stacktrace --build-cache --configuration-cache

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Run Android host tests
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          bash scripts/test-resolve-version.sh
          bash scripts/verify-backup-exclusions.sh
          ./gradlew :composeApp:testAndroidHostTest --stacktrace --build-cache --configuration-cache

      - name: Archive Android host test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-host-tests-push
          path: composeApp/build/test-results/testAndroidHostTest/TEST-*.xml

  android-apk:
    name: Android APK
    # Full build: PR, manual, reusable call, or v* tag (tag push keeps event_name=push).
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'workflow_call' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      is_release: ${{ steps.version.outputs.is_release }}
    env:
      # Stable path for SDK cache keys (matches setup-android on ubuntu-latest)
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          # shellcheck source=scripts/resolve-version.sh
          source scripts/resolve-version.sh
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "Resolved VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE IS_RELEASE=$IS_RELEASE"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Keep PR caches read-only; trusted pushes/tags/manual runs may populate the shared cache.
      - name: Setup Gradle (max cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          gradle-home-cache-excludes: |
            caches/*/kotlin-dsl/
            caches/*/scripts/
          # Avoid noisy PR comments; checks still show on the PR
          add-job-summary-as-pr-comment: never

      - name: Cache Android SDK packages
        id: cache-android-sdk
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms/android-37.0
            ${{ env.ANDROID_HOME }}/build-tools/37.0.0
            ${{ env.ANDROID_HOME }}/licenses
          key: android-sdk-37.0-buildtools-37.0.0-v3
          restore-keys: |
            android-sdk-37.0-buildtools-37.0.0-v3
            android-sdk-37.0-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept licenses + install platform (if cache miss)
        if: steps.cache-android-sdk.outputs.cache-hit != 'true'
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Accept licenses (cache hit)
        if: steps.cache-android-sdk.outputs.cache-hit == 'true'
        run: yes | sdkmanager --licenses >/dev/null || true

      # Static analysis (source-only; fail fast before APK work).
      - name: Detekt
        run: ./gradlew detekt --stacktrace --build-cache --configuration-cache

      # commonTest in composeApp also runs on K/N iOS sim (macOS job); miclient has a JVM target.
      - name: Unit tests (miclient JVM)
        run: ./gradlew :miclient:androidTest --stacktrace --build-cache --configuration-cache

      - name: Unit tests (composeApp Android host)
        run: |
          bash scripts/test-resolve-version.sh
          bash scripts/verify-backup-exclusions.sh
          ./gradlew :composeApp:testAndroidHostTest --stacktrace --build-cache --configuration-cache

      - name: Archive Android host test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-host-tests-build
          path: composeApp/build/test-results/testAndroidHostTest/TEST-*.xml

      - name: Prepare release signing
        if: steps.version.outputs.is_release == 'true'
        env:
          STORE_BASE64: ${{ secrets.ANDROID_RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          test "$VERSION_CODE" -gt 1000046 || { echo 'Release must be newer than HealthLab .40'; exit 1; }
          test -n "$STORE_BASE64" || { echo 'Missing Android release keystore'; exit 1; }
          umask 077
          STORE_FILE="$RUNNER_TEMP/healthlab-release.keystore"
          printf '%s' "$STORE_BASE64" | base64 --decode > "$STORE_FILE"
          echo "ANDROID_RELEASE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"

      - name: Build APK (debug for PR, release for tags)
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_RELEASE_STORE_PASSWORD || '' }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_RELEASE_KEY_ALIAS || '' }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.ANDROID_RELEASE_KEY_PASSWORD || '' }}
          EXPECTED_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            TASK=:androidApp:assembleRelease
            VARIANT=release
          else
            TASK=:androidApp:assembleDebug
            VARIANT=debug
          fi
          ./gradlew "$TASK" \
            -PversionName=${{ env.VERSION_NAME }} \
            -PversionCode=${{ env.VERSION_CODE }} \
            --stacktrace --build-cache --configuration-cache
          APK="androidApp/build/outputs/apk/$VARIANT/androidApp-$VARIANT.apk"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > apk-badging.txt
          grep -F "versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" apk-badging.txt
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            if grep -q '^application-debuggable' apk-badging.txt; then
              echo "ERROR: release APK is debuggable: $APK"
              exit 1
            fi
            "$BUILD_TOOLS/apksigner" verify --print-certs "$APK" > apk-certs.txt
            ACTUAL_CERT_SHA256=$(sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' apk-certs.txt | sort -u)
            [[ "$EXPECTED_CERT_SHA256" =~ ^[[:xdigit:]]{64}$ && "$ACTUAL_CERT_SHA256" == "${EXPECTED_CERT_SHA256,,}" ]] || {
              echo 'APK signer did not match the configured release certificate'
              exit 1
            }
            [[ "$ACTUAL_CERT_SHA256" != 77bfa8d392de05f06643b045e6f9de3364269992816293efaa57fb0c20a580ab ]] || {
              echo 'The old public HealthLab signing certificate is not allowed for releases'
              exit 1
            }
          fi
          echo "BUILT_APK=$APK" >> "$GITHUB_ENV"

      - name: Remove release keystore
        if: always() && steps.version.outputs.is_release == 'true'
        run: rm -f -- "$RUNNER_TEMP/healthlab-release.keystore"

      - name: Stage artifact
        run: |
          mkdir -p dist
          APK="$BUILT_APK"
          test -f "$APK"
          # Stable name for releases/latest/download/BetterMiFitnessSync.apk
          cp "$APK" "dist/BetterMiFitnessSync.apk"
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            cp "$APK" "dist/BetterMiFitnessSync-${{ steps.version.outputs.version_name }}.apk"
          else
            cp "$APK" "dist/BetterMiFitnessSync-${{ github.run_number }}-${{ github.sha }}.apk"
          fi
          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: BetterMiFitnessSync-android-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

  ios-ipa:
    name: iOS IPA
    if: >-
      (!startsWith(github.ref, 'refs/tags/') &&
       (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call')) ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-healthlab.') &&
       vars.IOS_HEALTHKIT_VERIFIED_COMMIT == github.sha)
    runs-on: macos-latest
    timeout-minutes: 90
    # Release K/N link needs more heap than debug (CI failed with "Java heap space").
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.daemon=false
        -Dorg.gradle.parallel=true
        -Dorg.gradle.caching=true
        -Dorg.gradle.jvmargs=-Xmx6g
        -Dkotlin.daemon.jvm.options=-Xmx6g
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          source scripts/resolve-version.sh
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "IOS_MARKETING_VERSION=$IOS_MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "Resolved VERSION_NAME=$VERSION_NAME VERSION_CODE=$VERSION_CODE IS_RELEASE=$IS_RELEASE"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Gradle (max cache)
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          cache-cleanup: on-success
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-includes: |
            caches
            notifications
            jdks
            wrapper
          gradle-home-cache-excludes: |
            caches/*/kotlin-dsl/
            caches/*/scripts/

      # Kotlin/Native toolchains + dependencies (largest iOS compile win)
      - name: Cache Kotlin/Native (Konan)
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.KONAN_DATA_DIR }}
            ~/.konan
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-konan-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}-v4
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-konan-v4-
            ${{ runner.os }}-konan-v3-

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Show toolchain
        run: |
          java -version
          xcodebuild -version
          bash scripts/verify-ci-gates.sh
          bash scripts/verify-ios-healthkit-gate.sh
          echo "JAVA_HOME=$JAVA_HOME"
          echo "KONAN_DATA_DIR=$KONAN_DATA_DIR"

      # Homebrew bottles (xcodegen)
      - name: Cache Homebrew
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/xcodegen
            /opt/homebrew/bin/xcodegen
            /usr/local/Cellar/xcodegen
            /usr/local/bin/xcodegen
          key: ${{ runner.os }}-brew-xcodegen-v3
          restore-keys: |
            ${{ runner.os }}-brew-xcodegen-v3
            ${{ runner.os }}-brew-xcodegen-
            ${{ runner.os }}-brew-

      - name: Install XcodeGen
        run: |
          if command -v xcodegen >/dev/null 2>&1; then
            xcodegen --version
          else
            brew install xcodegen
          fi

      - name: Generate Xcode project
        working-directory: iosApp
        run: xcodegen generate

      - name: Inject iOS marketing / build version
        run: |
          set -euo pipefail
          PLIST="iosApp/iosApp/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${IOS_MARKETING_VERSION}" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION_CODE}" "$PLIST"
          echo "Info.plist version:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      # composeApp commonTest on the K/N iOS simulator target only.
      # miclient JVM tests already run on the Ubuntu job — skip redundant :miclient:allTests.
      # :allTests also builds device-only test artifacts this job never runs.
      - name: Unit tests (composeApp)
        run: ./gradlew :composeApp:iosSimulatorArm64Test --stacktrace --build-cache --configuration-cache

      - name: Link Kotlin iOS device framework (Release)
        run: >
          ./gradlew :composeApp:linkReleaseFrameworkIosArm64
          -Dorg.gradle.jvmargs="-Xmx6g -Dkotlin.daemon.jvm.options=-Xmx6g"
          --stacktrace --build-cache --configuration-cache

      # Xcode DerivedData for Swift / link steps (secondary to Konan).
      # Version inject rewrites Info.plist, so iosApp/** would bust the key
      # every build; hash stable inputs plus the pinned Xcode version instead.
      # PRs restore only — main/tags save, so PRs reuse the warm main cache.
      - name: Restore Xcode DerivedData
        uses: actions/cache/restore@v5
        with:
          path: iosApp/build/DerivedData
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-dd-rel-${{ hashFiles('iosApp/project.yml', 'iosApp/iosApp/**/*.swift', 'iosApp/iosApp/Assets.xcassets/**', 'composeApp/build.gradle.kts', 'gradle/libs.versions.toml') }}-v5
          restore-keys: |
            ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-dd-rel-v5-
            ${{ runner.os }}-dd-rel-v4-
            ${{ runner.os }}-dd-

      # Release only — Debug device builds ship .debug.dylib and crash when sideloaded.
      - name: Build iOS app (unsigned Release, device arm64)
        working-directory: iosApp
        run: |
          set -euo pipefail
          xcodebuild \
            -project BetterMiFitnessSync.xcodeproj \
            -scheme BetterMiFitnessSync \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            MARKETING_VERSION="${VERSION_NAME}" \
            CURRENT_PROJECT_VERSION="${VERSION_CODE}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package IPA
        run: |
          set -euo pipefail
          APP=$(find iosApp/build/DerivedData/Build/Products -path "*Release-iphoneos*/BetterMiFitnessSync.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "Release app not found under DerivedData"
            find iosApp/build/DerivedData/Build/Products -name '*.app' -type d || true
            exit 1
          fi
          echo "Using app: $APP"

          # Guard against accidentally packaging a Debug app.
          if [ -f "$APP/BetterMiFitnessSync.debug.dylib" ]; then
            echo "Refusing to package Debug binary (BetterMiFitnessSync.debug.dylib present)"
            exit 1
          fi
          case "$APP" in
            *Debug*) echo "Refusing path that looks like Debug: $APP"; exit 1 ;;
          esac

          # Fail CI if home-screen icons are missing (sideload tools need these).
          if [ ! -f "$APP/Assets.car" ] && ! ls "$APP"/AppIcon*.png >/dev/null 2>&1; then
            echo "ERROR: app bundle has no Assets.car / AppIcon*.png (icon would be blank)"
            ls -la "$APP" || true
            exit 1
          fi
          ls -la "$APP"/AppIcon*.png "$APP/Assets.car" 2>/dev/null || true

          mkdir -p Payload dist
          rm -rf Payload/*
          cp -R "$APP" Payload/
          zip -qry "dist/BetterMiFitnessSync.ipa" Payload
          if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
            NAME="BetterMiFitnessSync-${{ steps.version.outputs.version_name }}.ipa"
          else
            NAME="BetterMiFitnessSync-${{ github.run_number }}-${{ github.sha }}.ipa"
          fi
          cp "dist/BetterMiFitnessSync.ipa" "dist/${NAME}"
          ls -lh dist/

      - name: Upload IPA
        uses: actions/upload-artifact@v6
        with:
          name: BetterMiFitnessSync-ios-ipa
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      # PRs restore the warm main cache above but never overwrite it.
      - name: Save Xcode DerivedData (main/tags only)
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: iosApp/build/DerivedData
          key: ${{ runner.os }}-xcode${{ env.XCODE_VERSION }}-dd-rel-${{ hashFiles('iosApp/project.yml', 'iosApp/iosApp/**/*.swift', 'iosApp/iosApp/Assets.xcassets/**', 'composeApp/build.gradle.kts', 'gradle/libs.versions.toml') }}-v5

  # ─── GitHub Release (tags only) ───────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs: [android-apk, ios-ipa]
    if: >-
      !cancelled() && startsWith(github.ref, 'refs/tags/v') &&
      needs.android-apk.result == 'success' &&
      (needs.ios-ipa.result == 'success' ||
       (needs.ios-ipa.result == 'skipped' &&
        (contains(github.ref_name, '-healthlab.') || vars.IOS_HEALTHKIT_VERIFIED_COMMIT != github.sha)))
    runs-on: ubuntu-latest
    concurrency:
      group: android-release-publish-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          source scripts/resolve-version.sh
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Reject duplicate or older Android releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          published_tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq \
            '.[] | select(.draft == false) | select(any(.assets[]; .name | ascii_downcase | endswith(".apk"))) | .tag_name')
          bash scripts/verify-release-order.sh "$GITHUB_REF_NAME" <<< "$published_tags"

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: BetterMiFitnessSync-android-apk
          path: dist

      - name: Download IPA
        if: needs.ios-ipa.result == 'success'
        uses: actions/download-artifact@v7
        with:
          name: BetterMiFitnessSync-ios-ipa
          path: dist

      - name: Changelog since previous tag
        id: notes
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo "## Better Mi Fitness Sync ${{ steps.version.outputs.version_name }}"
            echo ""
            echo "### Install"
            echo ""
            echo "- **Android:** Download the APK under Assets. An installation signed with the old public HealthLab key cannot be upgraded in place with the new signing key."
            if [ "${{ needs.ios-ipa.result }}" = "success" ]; then
              echo "- **iOS:** Download the unsigned IPA under Assets and re-sign it with a team that has the HealthKit entitlement."
            fi
            echo ""
            if [ -n "$PREV" ]; then
              echo "### Changes since \`$PREV\`"
              echo ""
              # Skip merge commits ("Merge pull request #N …") — they only
              # duplicate the feat/fix commits already listed below.
              git log --pretty=format:'- %s (%h)' --no-merges "${PREV}..HEAD"
              echo ""
            else
              echo "### Changes"
              echo ""
              echo "Initial tagged release."
              echo ""
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Better Mi Fitness Sync ${{ steps.version.outputs.version_name }}
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
